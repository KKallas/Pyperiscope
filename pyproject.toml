[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyperiscope"
version = "2.0.0.dev0"
description = "Visual GUI automation for legacy software, written and repaired by coding agents (Claude Code, Codex)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Kaspar Kallas", email = "kaspar.kana.kallas@gmail.com"}
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mss>=10.0",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
]
keywords = ["gui automation", "rpa", "template matching", "agents", "claude code", "codex"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pyperiscope = "pyperiscope.cli:main"

[project.urls]
"Homepage" = "https://github.com/KKallas/Pyperiscope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyperiscope = ["scaffold/*", "scaffold/workflows/*", "server/static/*", "manual/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
